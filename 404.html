{% extends "base.html" %}

{% block title %}404 Not Found – Career Pilot{% endblock %}

{% block content %}
<div class="empty-state" style="padding: 5rem 2rem; max-width: 600px; margin: 2rem auto;">
    <div class="empty-state-icon">🧭</div>
    <h1 style="font-size: 2.5rem; font-weight: 800; color: var(--accent-cyan); margin-bottom: 0.75rem;">404 Page Not Found</h1>
    <h3 style="font-size: 1.25rem; color: var(--text-primary); margin-bottom: 1rem;">Off the Radar</h3>
    <p style="color: var(--text-secondary); margin-bottom: 2rem;">
        {{ message or "The page or career resource you are looking for does not exist or may have been moved." }}
    </p>
    <div style="display: flex; justify-content: center; gap: 1rem;">
        <a href="{{ url_for('main.index') }}" class="btn btn-primary">Go to Home</a>
        <a href="{{ url_for('careers.list_careers') }}" class="btn btn-secondary">Browse Careers</a>
    </div>
</div>
{% endblock %}
